name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Susun proyek
        run: |
          mkdir -p app/src/main/java/com/adjm/scan app/src/main/res/drawable-nodpi
          cat > settings.gradle <<'EOF_ADJM'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ADJMScan'
          include ':app'
          EOF_ADJM
          cat > build.gradle <<'EOF_ADJM'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_ADJM
          cat > gradle.properties <<'EOF_ADJM'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_ADJM
          cat > app/build.gradle <<'EOF_ADJM'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.adjm.scan'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.adjm.scan'
                  minSdk 27
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          EOF_ADJM
          cat > app/src/main/AndroidManifest.xml <<'EOF_ADJM'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <application
                  android:label="ADJM Scan"
                  android:icon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_ADJM
          cat > app/src/main/java/com/adjm/scan/RadarView.java <<'EOF_ADJM'
          package com.adjm.scan;

          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.SweepGradient;
          import android.view.View;
          import java.util.ArrayList;
          import java.util.List;

          public class RadarView extends View {
              private final Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint tp = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Paint sw = new Paint(Paint.ANTI_ALIAS_FLAG);
              private final Matrix m = new Matrix();
              private float sweep = 45f;
              private boolean running = false;
              private long lastT = 0;
              private List<float[]> blips = new ArrayList<>();

              public RadarView(Context c) {
                  super(c);
                  tp.setTextAlign(Paint.Align.CENTER);
              }

              public void setRunning(boolean r) {
                  running = r;
                  lastT = 0;
                  invalidate();
              }

              public void setBlips(List<float[]> b) {
                  blips = b;
                  invalidate();
              }

              @Override
              protected void onDraw(Canvas c) {
                  int w = getWidth(), h = getHeight();
                  float side = Math.min(w, h);
                  float cx = w / 2f, cy = h / 2f, half = side / 2f;

                  p.setStyle(Paint.Style.FILL);
                  p.setColor(0xFF262626);
                  c.drawRect(cx - half, cy - half, cx + half, cy + half, p);
                  p.setColor(0xFF7A7A7A);
                  c.drawRect(cx - half, cy - half, cx + half, cy - half + side * 0.02f, p);
                  float in = side * 0.035f;
                  p.setColor(0xFF062B0C);
                  c.drawRect(cx - half + in, cy - half + in, cx + half - in, cy + half - in, p);

                  float R = (half - in) * 0.84f;

                  p.setStyle(Paint.Style.STROKE);
                  p.setStrokeWidth(Math.max(1f, side * 0.003f));
                  p.setColor(0x7738D84A);
                  for (int i = 1; i < 8; i++) c.drawCircle(cx, cy, R * i / 8f, p);
                  for (int a = 0; a < 360; a += 15) {
                      double r = Math.toRadians(a);
                      float s = (float) Math.sin(r), co = (float) Math.cos(r);
                      c.drawLine(cx + R * 0.1f * s, cy - R * 0.1f * co, cx + R * s, cy - R * co, p);
                  }
                  p.setStrokeWidth(Math.max(2f, side * 0.006f));
                  p.setColor(0xFF3BE04F);
                  c.drawCircle(cx, cy, R, p);
                  c.drawCircle(cx, cy, R * 0.1f, p);

                  tp.setTextSize(side * 0.034f);
                  tp.setColor(0xAA3BE04F);
                  for (int a = 0; a < 360; a += 15) {
                      c.save();
                      c.rotate(a, cx, cy);
                      c.drawText(String.valueOf(a), cx, cy - R * 1.05f, tp);
                      c.restore();
                  }

                  if (running) {
                      long now = System.nanoTime();
                      float dt = lastT == 0 ? 0f : (now - lastT) / 1e9f;
                      if (dt > 0.1f) dt = 0.1f;
                      lastT = now;
                      sweep = (sweep + 90f * dt) % 360f;
                  }

                  int[] cols = {0x0000FF00, 0x0000FF00, 0xAA3BFF4F};
                  float[] pos = {0f, 0.8f, 1f};
                  SweepGradient g = new SweepGradient(cx, cy, cols, pos);
                  m.setRotate(sweep - 90f, cx, cy);
                  g.setLocalMatrix(m);
                  sw.setStyle(Paint.Style.FILL);
                  sw.setShader(g);
                  c.drawCircle(cx, cy, R, sw);
                  double sr = Math.toRadians(sweep);
                  p.setStrokeWidth(Math.max(2f, side * 0.005f));
                  p.setColor(0xFF7CFF8C);
                  c.drawLine(cx, cy, cx + R * (float) Math.sin(sr), cy - R * (float) Math.cos(sr), p);

                  p.setStyle(Paint.Style.FILL);
                  for (float[] b : blips) {
                      double ar = Math.toRadians(b[0]);
                      float x = cx + R * b[1] * (float) Math.sin(ar);
                      float y = cy - R * b[1] * (float) Math.cos(ar);
                      float al = 1f;
                      if (running) {
                          float delta = (sweep - b[0] + 360f) % 360f;
                          al = 1f - delta / 360f * 0.75f;
                      }
                      int a1 = (int) (al * 90), a2 = (int) (al * 255);
                      p.setColor((a1 << 24) | 0x3BFF4F);
                      c.drawCircle(x, y, side * 0.026f, p);
                      p.setColor((a2 << 24) | 0xB8FFB8);
                      c.drawCircle(x, y, side * 0.011f, p);
                  }

                  if (running) postInvalidateOnAnimation();
              }
          }
          EOF_ADJM
          cat > app/src/main/java/com/adjm/scan/MainActivity.java <<'EOF_ADJM'
          package com.adjm.scan;

          import android.Manifest;
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.location.LocationManager;
          import android.net.wifi.ScanResult;
          import android.net.wifi.WifiInfo;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.provider.Settings;
          import android.util.DisplayMetrics;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {
              private static final int REQ = 7;
              private WifiManager wm;
              private RadarView radar;
              private LinearLayout list;
              private ScrollView sv;
              private TextView count;
              private float d;
              private boolean scanning = false, receiverOn = false;
              private final Handler h = new Handler(Looper.getMainLooper());
              private final Set<String> open = new HashSet<>();
              private List<ScanResult> last = new ArrayList<>();

              private final BroadcastReceiver rec = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context c, Intent i) {
                      if (scanning) load();
                  }
              };
              private final Runnable fallback = new Runnable() {
                  @Override
                  public void run() {
                      if (scanning) load();
                  }
              };
              private final Runnable loop = new Runnable() {
                  @Override
                  public void run() {
                      if (!scanning) return;
                      try { wm.startScan(); } catch (Exception e) { }
                      h.postDelayed(fallback, 3500);
                      h.postDelayed(this, 7000);
                  }
              };

              private int dp(int v) { return (int) (v * d + 0.5f); }

              private TextView tv(String t, int sp, int col, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(t);
                  v.setTextSize(TypedValue.COMPLEX_UNIT_SP, sp);
                  v.setTextColor(col);
                  if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
                  return v;
              }

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  d = getResources().getDisplayMetrics().density;
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);
                  DisplayMetrics dm = getResources().getDisplayMetrics();

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setBackgroundColor(Color.BLACK);
                  root.setPadding(dp(12), dp(8), dp(12), dp(10));

                  TextView title = tv("ADJM - Scan", 26, Color.WHITE, false);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, new LinearLayout.LayoutParams(-1, -2));

                  radar = new RadarView(this);
                  int rh = Math.min(dm.widthPixels - dp(24), (int) (dm.heightPixels * 0.36f));
                  LinearLayout.LayoutParams rp = new LinearLayout.LayoutParams(-1, rh);
                  rp.topMargin = dp(6);
                  root.addView(radar, rp);

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  row.setPadding(0, dp(10), 0, 0);
                  row.addView(btn("PINDAI", v -> startScan()), new LinearLayout.LayoutParams(0, -2, 1));
                  row.addView(btn("STOP", v -> stopScan()), new LinearLayout.LayoutParams(0, -2, 1));
                  row.addView(btn("RELOAD", v -> reload()), new LinearLayout.LayoutParams(0, -2, 1));
                  root.addView(row, new LinearLayout.LayoutParams(-1, -2));

                  LinearLayout rr = new LinearLayout(this);
                  rr.setOrientation(LinearLayout.HORIZONTAL);
                  rr.setPadding(0, dp(10), 0, dp(4));
                  rr.addView(tv("RESULTS", 16, Color.WHITE, true), new LinearLayout.LayoutParams(0, -2, 1));
                  count = tv("", 13, 0xFF9FD0FF, false);
                  rr.addView(count, new LinearLayout.LayoutParams(-2, -2));
                  root.addView(rr, new LinearLayout.LayoutParams(-1, -2));

                  FrameLayout frame = new FrameLayout(this);
                  frame.setBackgroundColor(0xFF0F3D55);
                  frame.setPadding(dp(5), dp(5), dp(5), dp(5));
                  sv = new ScrollView(this);
                  sv.setBackgroundColor(0xFF0F4A75);
                  list = new LinearLayout(this);
                  list.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(list, new ViewGroup.LayoutParams(-1, -2));
                  frame.addView(sv, new FrameLayout.LayoutParams(-1, -1));
                  root.addView(frame, new LinearLayout.LayoutParams(-1, 0, 1));

                  setContentView(root);
                  showHint("Tekan PINDAI untuk mulai memindai jaringan Wi-Fi di sekitar.");
              }

              private View btn(String label, View.OnClickListener l) {
                  LinearLayout c = new LinearLayout(this);
                  c.setOrientation(LinearLayout.VERTICAL);
                  c.setGravity(Gravity.CENTER_HORIZONTAL);
                  View k = new View(this);
                  GradientDrawable g = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{0xFFFF7A7A, 0xFFFF2020, 0xFFF00000});
                  g.setStroke(dp(3), 0xFF1E9BF0);
                  k.setBackground(g);
                  c.addView(k, new LinearLayout.LayoutParams(dp(70), dp(38)));
                  TextView t = tv(label, 15, Color.WHITE, true);
                  LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(-2, -2);
                  tp.topMargin = dp(6);
                  c.addView(t, tp);
                  c.setOnClickListener(l);
                  c.setOnTouchListener((v, e) -> {
                      int a = e.getAction();
                      if (a == MotionEvent.ACTION_DOWN) v.setAlpha(0.6f);
                      else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) v.setAlpha(1f);
                      return false;
                  });
                  return c;
              }

              private void showHint(String s) {
                  list.removeAllViews();
                  TextView t = tv(s, 14, Color.WHITE, false);
                  t.setPadding(dp(14), dp(16), dp(14), dp(16));
                  list.addView(t);
              }

              private boolean locationOn() {
                  try {
                      LocationManager lm = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 28) return lm.isLocationEnabled();
                      return lm.isProviderEnabled(LocationManager.GPS_PROVIDER)
                              || lm.isProviderEnabled(LocationManager.NETWORK_PROVIDER);
                  } catch (Exception e) {
                      return true;
                  }
              }

              private void startScan() {
                  if (scanning) return;
                  if (Build.VERSION.SDK_INT >= 23
                          && checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, REQ);
                      return;
                  }
                  if (!wm.isWifiEnabled()) {
                      if (Build.VERSION.SDK_INT < 29) {
                          try { wm.setWifiEnabled(true); } catch (Exception e) { }
                      } else {
                          showHint("Wi-Fi sedang mati. Aktifkan Wi-Fi, lalu tekan PINDAI.");
                          return;
                      }
                  }
                  if (!locationOn()) {
                      showHint("Lokasi (GPS) sedang mati. Android mewajibkan Lokasi aktif agar hasil pemindaian Wi-Fi bisa dibaca. Aktifkan Lokasi, lalu kembali dan tekan PINDAI.");
                      try { startActivity(new Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS)); } catch (Exception e) { }
                      return;
                  }
                  scanning = true;
                  if (!receiverOn) {
                      registerReceiver(rec, new IntentFilter(WifiManager.SCAN_RESULTS_AVAILABLE_ACTION));
                      receiverOn = true;
                  }
                  radar.setRunning(true);
                  if (last.isEmpty()) showHint("Memindai...");
                  h.post(loop);
              }

              private void stopScan() {
                  scanning = false;
                  h.removeCallbacks(loop);
                  h.removeCallbacks(fallback);
                  radar.setRunning(false);
                  if (receiverOn) {
                      try { unregisterReceiver(rec); } catch (Exception e) { }
                      receiverOn = false;
                  }
              }

              private void reload() {
                  stopScan();
                  last = new ArrayList<>();
                  open.clear();
                  radar.setBlips(new ArrayList<float[]>());
                  count.setText("");
                  showHint("Memuat ulang...");
                  startScan();
              }

              @Override
              public void onRequestPermissionsResult(int code, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(code, perms, res);
                  if (code == REQ) {
                      if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) startScan();
                      else showHint("Izin Lokasi diperlukan oleh Android untuk membaca daftar Wi-Fi. Tekan PINDAI lalu pilih Izinkan.");
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  stopScan();
              }

              @Override
              protected void onDestroy() {
                         stopScan();
                  super.onDestroy();
              }

              private void load() {
                  List<ScanResult> r;
                  try {
                      r = wm.getScanResults();
                  } catch (Exception e) {
                      return;
                  }
                  if (r == null) return;
                  last = new ArrayList<>(r);
                  Collections.sort(last, (a, b) -> b.level - a.level);
                  render();
              }

              private void render() {
                  final int y = sv.getScrollY();
                  list.removeAllViews();
                  List<float[]> bl = new ArrayList<>();
                  count.setText(last.size() + " jaringan");
                  if (last.isEmpty()) {
                      showHint("Belum ada jaringan Wi-Fi yang terdeteksi.");
                      radar.setBlips(bl);
                      return;
                  }
                  String cur = null;
                  try {
                      WifiInfo wi = wm.getConnectionInfo();
                      if (wi != null) cur = wi.getBSSID();
                  } catch (Exception e) { }
                  for (ScanResult s : last) {
                      list.addView(item(s, cur));
                      bl.add(blip(s));
                  }
                  radar.setBlips(bl);
                  sv.post(() -> sv.scrollTo(0, y));
              }

              private float[] blip(ScanResult s) {
                  String id = s.BSSID == null ? "" : s.BSSID;
                  float ang = (id.hashCode() & 0x7fffffff) % 360;
                  float t = (-30f - s.level) / 65f;
                  if (t < 0f) t = 0f;
                  if (t > 1f) t = 1f;
                  return new float[]{ang, 0.12f + 0.85f * t};
              }

              private View item(ScanResult s, String cur) {
                  final String id = s.BSSID == null ? "" : s.BSSID;
                  boolean conn = cur != null && id.equalsIgnoreCase(cur);
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), dp(10), dp(12), dp(10));
                  box.setBackgroundColor(0xFF1A72B5);

                  LinearLayout head = new LinearLayout(this);
                  head.setOrientation(LinearLayout.HORIZONTAL);
                  head.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout left = new LinearLayout(this);
                  left.setOrientation(LinearLayout.VERTICAL);
                  left.addView(tv(ssid(s) + (conn ? "  [TERHUBUNG]" : ""), 16, Color.WHITE, true));
                  left.addView(tv(s.level + " dBm  |  " + band(s.frequency) + "  |  Ch " + chan(s.frequency) + "  |  " + sec(s.capabilities),
                          12, 0xFFD6EBFF, false));
                  head.addView(left, new LinearLayout.LayoutParams(0, -2, 1));
                  int pct = pct(s.level);
                  head.addView(tv(pct + "%", 16, pct >= 70 ? 0xFF6DFF6D : pct >= 40 ? 0xFFFFE94D : 0xFFFF7B7B, true),
                          new LinearLayout.LayoutParams(-2, -2));
                  box.addView(head);

                  final TextView det = tv(detail(s, conn), 13, Color.WHITE, false);
                  det.setPadding(0, dp(8), 0, 0);
                  det.setVisibility(open.contains(id) ? View.VISIBLE : View.GONE);
                  box.addView(det);
                  box.setOnClickListener(v -> {
                      if (open.contains(id)) {
                          open.remove(id);
                          det.setVisibility(View.GONE);
                      } else {
                          open.add(id);
                          det.setVisibility(View.VISIBLE);
                      }
                  });
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.bottomMargin = dp(2);
                  box.setLayoutParams(lp);
                  return box;
              }

              private String ssid(ScanResult s) {
                  String n = s.SSID;
                  return (n == null || n.isEmpty()) ? "(Jaringan tersembunyi)" : n;
              }

              private int pct(int level) {
                  int p = 2 * (level + 100);
                  return p < 0 ? 0 : (p > 100 ? 100 : p);
              }

              private String band(int f) {
                  return f < 3000 ? "2.4 GHz" : (f < 5900 ? "5 GHz" : "6 GHz");
              }

              private int chan(int f) {
                  if (f == 2484) return 14;
                  if (f < 3000) return (f - 2407) / 5;
                  if (f < 5900) return (f - 5000) / 5;
                  return (f - 5950) / 5;
              }

              private String sec(String cap) {
                  String c = cap == null ? "" : cap;
                  List<String> p = new ArrayList<>();
                  if (c.contains("[WPA-") || c.contains("[WPA]")) p.add("WPA");
                  if (c.contains("WPA2") || c.contains("RSN")) p.add("WPA2");
                  if (c.contains("WPA3") || c.contains("SAE")) p.add("WPA3");
                  if (!p.isEmpty()) {
                      StringBuilder sb = new StringBuilder();
                      for (String x : p) {
                          if (sb.length() > 0) sb.append("/");
                          sb.append(x);
                      }
                      return sb.toString();
                  }
                  if (c.contains("WEP")) return "WEP";
                  if (c.contains("OWE")) return "OWE";
                  return "Terbuka";
              }

              private String width(ScanResult s) {
                  switch (s.channelWidth) {
                      case ScanResult.CHANNEL_WIDTH_20MHZ: return "20 MHz";
                      case ScanResult.CHANNEL_WIDTH_40MHZ: return "40 MHz";
                      case ScanResult.CHANNEL_WIDTH_80MHZ: return "80 MHz";
                      case ScanResult.CHANNEL_WIDTH_160MHZ: return "160 MHz";
                      case ScanResult.CHANNEL_WIDTH_80MHZ_PLUS_MHZ: return "80+80 MHz";
                      default: return "-";
                  }
              }

              private String standard(ScanResult s) {
                  if (Build.VERSION.SDK_INT < 30) return "Tidak tersedia di versi Android ini";
                  switch (s.getWifiStandard()) {
                      case 1: return "Legacy (802.11a/b/g)";
                      case 4: return "Wi-Fi 4 (802.11n)";
                      case 5: return "Wi-Fi 5 (802.11ac)";
                      case 6: return "Wi-Fi 6 (802.11ax)";
                      case 7: return "802.11ad";
                      case 8: return "Wi-Fi 7 (802.11be)";
                      default: return "Tidak diketahui";
                  }
              }

              private String detail(ScanResult s, boolean conn) {
                  int pct = pct(s.level);
                  String q = pct >= 80 ? "Sangat baik" : pct >= 60 ? "Baik" : pct >= 40 ? "Cukup" : "Lemah";
                  double dist = Math.pow(10.0, (27.55 - 20.0 * Math.log10(s.frequency) + Math.abs(s.level)) / 20.0);
                  long age = (SystemClock.elapsedRealtime() * 1000L - s.timestamp) / 1000000L;
                  if (age < 0) age = 0;
                  String cap = s.capabilities == null ? "" : s.capabilities;
                  StringBuilder sb = new StringBuilder();
                  sb.append("Nama (SSID)  : ").append(ssid(s)).append('\n');
                  sb.append("BSSID (MAC)  : ").append(s.BSSID).append('\n');
                  sb.append("Status       : ").append(conn ? "Terhubung" : "Tidak terhubung").append('\n');
                  sb.append("Sinyal       : ").append(s.level).append(" dBm (").append(pct).append("%, ").append(q).append(")\n");
                  sb.append("Frekuensi    : ").append(s.frequency).append(" MHz (").append(band(s.frequency)).append(")\n");
                  sb.append("Kanal        : ").append(chan(s.frequency)).append('\n');
                  sb.append("Lebar kanal  : ").append(width(s)).append('\n');
                  if (s.centerFreq0 > 0) sb.append("Frek. tengah : ").append(s.centerFreq0).append(" MHz\n");
                  sb.append("Keamanan     : ").append(sec(cap)).append('\n');
                  sb.append("WPS          : ").append(cap.contains("WPS") ? "Aktif" : "Tidak").append('\n');
                  sb.append("Standar      : ").append(standard(s)).append('\n');
                  sb.append("Jarak (kira2): ").append(String.format(Locale.US, "%.1f", dist)).append(" m\n");
                  sb.append("Terlihat     : ").append(age).append(" detik lalu\n");
